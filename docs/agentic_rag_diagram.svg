<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 680 690" width="680" height="690" font-family="Segoe UI, Helvetica, Arial, sans-serif" role="img" aria-label="Agentic RAG block diagram">
<title>Agentic RAG block diagram</title>
<defs><marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#666" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker><marker id="b" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M2 1L8 5L2 9" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="680" height="690" fill="#ffffff"/>
<rect x="20" y="20" width="640" height="202" rx="12" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
<text x="32" y="40" font-size="12" fill="#555">Indexing: runs once at startup</text>
<rect x="40" y="56" width="170" height="56" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
<text x="125.0" y="74" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0C447C">PDF folder</text>
<text x="125.0" y="93" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">recursive, every .pdf</text>
<rect x="245" y="56" width="170" height="56" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
<text x="330.0" y="74" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0C447C">Extract and chunk</text>
<text x="330.0" y="93" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">page by page, 200 words</text>
<rect x="450" y="56" width="170" height="56" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
<text x="535.0" y="74" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0C447C">Embed chunks</text>
<text x="535.0" y="93" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">MiniLM, 384-dim</text>
<rect x="380" y="146" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="1"/>
<text x="500.0" y="164" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">FAISS vector index</text>
<text x="500.0" y="183" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">IndexFlatIP, cosine similarity</text>
<line x1="212" y1="84" x2="243" y2="84" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="417" y1="84" x2="448" y2="84" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="535" y1="114" x2="535" y2="144" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="20" y="246" width="640" height="382" rx="12" fill="none" stroke="#999" stroke-width="1" stroke-dasharray="4 4"/>
<text x="32" y="266" font-size="12" fill="#555">Agent loop: repeats per question, max 6 rounds</text>
<rect x="40" y="282" width="260" height="56" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
<text x="170.0" y="300" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0C447C">User question</text>
<text x="170.0" y="319" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">free-text query</text>
<rect x="40" y="372" width="260" height="56" rx="8" fill="#FAEEDA" stroke="#EF9F27" stroke-width="1"/>
<text x="170.0" y="390" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#633806">System prompt + tools</text>
<text x="170.0" y="409" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#854F0B">rules + 2 tools + question</text>
<rect x="40" y="462" width="260" height="56" rx="8" fill="#FAECE7" stroke="#F0997B" stroke-width="1"/>
<text x="170.0" y="480" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#712B13">LLM: gpt-oss-120b</text>
<text x="170.0" y="499" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#993C1D">search again or answer</text>
<rect x="40" y="552" width="260" height="56" rx="8" fill="#F1EFE8" stroke="#B4B2A9" stroke-width="1"/>
<text x="170.0" y="570" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#2C2C2A">Final answer</text>
<text x="170.0" y="589" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#5F5E5A">when no tool call, cited [1], [2]</text>
<line x1="170" y1="340" x2="170" y2="370" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="170" y1="430" x2="170" y2="460" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="170" y1="520" x2="170" y2="550" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>
<rect x="380" y="372" width="240" height="56" rx="8" fill="#E6F1FB" stroke="#85B7EB" stroke-width="1"/>
<text x="500.0" y="390" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#0C447C">Embed query</text>
<text x="500.0" y="409" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#185FA5">tool call: search_papers</text>
<rect x="380" y="462" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="1"/>
<text x="500.0" y="480" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">FAISS search</text>
<text x="500.0" y="499" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">top-3 nearest chunks</text>
<rect x="380" y="552" width="240" height="56" rx="8" fill="#EEEDFE" stroke="#AFA9EC" stroke-width="1"/>
<text x="500.0" y="570" text-anchor="middle" dominant-baseline="central" font-size="14" font-weight="600" fill="#3C3489">Retrieved passages</text>
<text x="500.0" y="589" text-anchor="middle" dominant-baseline="central" font-size="12" fill="#534AB7">results go back to the LLM</text>
<line x1="500" y1="430" x2="500" y2="460" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>
<line x1="500" y1="520" x2="500" y2="550" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M300 476 L340 476 L340 400 L378 400" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M380 580 L340 580 L340 504 L302 504" fill="none" stroke="#666" stroke-width="1.5" marker-end="url(#a)"/>
<path d="M620 174 L642 174 L642 490 L622 490" fill="none" stroke="#7F77DD" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#b)"/>
<text x="634" y="238" text-anchor="end" font-size="12" fill="#555">index built once, reused by every search</text>
<rect x="40" y="650" width="12" height="12" rx="2" fill="#E6F1FB" stroke="#85B7EB"/>
<text x="58" y="656" dominant-baseline="central" font-size="12" fill="#555">Embedding</text>
<rect x="150" y="650" width="12" height="12" rx="2" fill="#EEEDFE" stroke="#AFA9EC"/>
<text x="168" y="656" dominant-baseline="central" font-size="12" fill="#555">Vector store / search</text>
<rect x="330" y="650" width="12" height="12" rx="2" fill="#FAEEDA" stroke="#EF9F27"/>
<text x="348" y="656" dominant-baseline="central" font-size="12" fill="#555">Prompt engineering</text>
<rect x="480" y="650" width="12" height="12" rx="2" fill="#FAECE7" stroke="#F0997B"/>
<text x="498" y="656" dominant-baseline="central" font-size="12" fill="#555">LLM</text>
<rect x="550" y="650" width="12" height="12" rx="2" fill="#F1EFE8" stroke="#B4B2A9"/>
<text x="568" y="656" dominant-baseline="central" font-size="12" fill="#555">Answer</text>
</svg>
